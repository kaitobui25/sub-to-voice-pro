# sub-to-voice-pro model configuration

translation:
  provider: google
  default_selection: google
  google_order:
    - google
    - microsoft
  gemini_order:
    - gemini
  auto_order:
    - google
    - microsoft
    - gemini
  base_url: https://generativelanguage.googleapis.com/v1beta

  # Fallback order. On HTTP 429, the adapter cools down that model and
  # continues with the next configured text-generation model.
  models:
    - gemini-3.5-flash-lite
    - gemini-3.8-flash
    - gemini-3.7-flash
    - gemini-3.1-flash-lite
    - gemini-flash-latest
    - gemini-3-flash-preview
    - gemini-2.5-flash
  source_language: auto
  target_language: vi
  fallback_providers:
    - microsoft

speaker_detection:
  render_batch_size: 8
  max_lines_per_request: 300
  max_prompt_chars: 60000
  context_size: 16
  timeout_ms: 25000
  model_timeout_ms: 10000
  models:
    - gemini-3.5-flash-lite
    - gemini-3.1-flash-lite
  lookahead_seconds: 60
  max_lookahead_seconds: 120

google_translate:
  base_url: https://translate.googleapis.com/translate_a/t
  client: gtx
  timeout_ms: 3500

microsoft_translate:
  auth_url: https://edge.microsoft.com/translate/auth
  base_url: https://api-edge.cognitive.microsofttranslator.com/translate
  token_ttl_ms: 540000
  timeout_ms: 3500

tts:
  provider: vieneu
  default_selection: vieneu
  auto_order:
    - vieneu
    - gemini
  auto_busy_retry_timeout_ms: 10000
  speed: 1

gemini_tts:
  base_url: https://generativelanguage.googleapis.com/v1beta
  # Fallback order. Adapter only moves to the next model on HTTP 429.
  models:
    - gemini-3.8-flash-lite-tts
    - gemini-3.8-flash-tts
  voice: Kore
  max_concurrency: 5

vieneu_tts:
  base_url: http://127.0.0.1:8000/v1
  model: vieneu-v3-turbo
  voice: Hải Đăng
  speaker_voices:
    - Hải Đăng
    - Trúc Ly
  sample_rate: 48000
  max_concurrency: 1
  busy_retry_timeout_ms: 120000
  busy_retry_delay_ms: 2000

audio:
  original_volume: 18
  voice_volume: 100
