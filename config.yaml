# sub-to-voice-pro model configuration

translation:
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta

  # Fallback order:
  # 1. gemini-2.5-flash
  # 2. gemini-flash-lite-latest
  # 3. gemini-3.5-flash-lite
  models:
    - gemini-2.5-flash
    - gemini-flash-lite-latest
    - gemini-3.5-flash-lite
  source_language: auto
  target_language: vi

tts:
  provider: gemini
  base_url: https://generativelanguage.googleapis.com/v1beta
  model: gemini-3.8-flash-lite-tts
  voice: Kore
  speed: 1

audio:
  original_volume: 18
  voice_volume: 100
